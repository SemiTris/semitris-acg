# ============================================================
# SemiTris-ACG 配置模板（application.example.yaml）
#
# 说明：
# 1. 真正的配置文件是 application.yaml（已被 .gitignore 忽略，
#    不会提交到仓库）。请把本文件【复制】一份命名为 application.yaml，
#    然后填上你自己的数据库密码和阿里云 OSS 密钥。
#    复制命令：copy application.example.yaml application.yaml
# 2. 阿里云 OSS：真实 AccessKey 只填在本地 application.yaml，
#    切勿提交到仓库。
# 3. 未配置 OSS 密钥时，上传接口返回「上传服务未配置」，不影响启动。
# ============================================================
spring:
  application:
    name: semitris-acg
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/semitris_acg?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root

  # 文件上传大小限制
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.commons.JakartaCommonsLoggingImpl
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.semitris.acg.entity

pagehelper:
  reasonable: true

# ====== 阿里云 OSS 云存储（密钥仅填本地 application.yaml，不入库） ======
oss:
  endpoint:              # 替换为 Bucket 所在地域 Endpoint
  access-key-id:         # 替换为 AccessKey ID
  access-key-secret:     # 替换为 AccessKey Secret
  bucket-name:           # 替换为 Bucket 名称
